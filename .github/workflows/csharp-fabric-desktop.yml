name: C# Fabric desktop build

on:
  push:
    branches:
      - feat/csharp-fabric-desktop-v1
    paths:
      - "DatabaseGenerator/**"
      - "ContosoFabric.Core/**"
      - "ContosoFabric.Fabric/**"
      - "ContosoFabric.Desktop/**"
      - "ContosoDGV2.sln"
      - ".github/workflows/csharp-fabric-desktop.yml"
  pull_request:
    paths:
      - "DatabaseGenerator/**"
      - "ContosoFabric.Core/**"
      - "ContosoFabric.Fabric/**"
      - "ContosoFabric.Desktop/**"
      - "ContosoDGV2.sln"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore ContosoDGV2.sln
      - run: dotnet build ContosoDGV2.sln -c Release --no-restore
