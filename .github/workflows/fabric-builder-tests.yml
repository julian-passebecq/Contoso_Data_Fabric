name: Fabric Builder tests

on:
  push:
    paths:
      - "fabric_builder/**"
      - ".github/workflows/fabric-builder-tests.yml"
  pull_request:
    paths:
      - "fabric_builder/**"
      - ".github/workflows/fabric-builder-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./fabric_builder[dev]"
      - run: pytest fabric_builder/tests -q
